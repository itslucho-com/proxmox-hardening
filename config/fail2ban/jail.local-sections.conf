# Sections to add to /etc/fail2ban/jail.local
# (first: sudo cp /etc/fail2ban/jail.conf /etc/fail2ban/jail.local)
# Homelab From Scratch #2 (It's Lucho) · see 05-fail2ban.md
# Proxmox VE 9 has no /var/log/auth.log: everything is read from the systemd journal.

[sshd]
enabled = true
# your new SSH port (example)
port = 24816
backend = systemd

[proxmox]
enabled = true
port = https,http,8006
filter = proxmox
backend = systemd
maxretry = 3
findtime = 2d
bantime = 1h
