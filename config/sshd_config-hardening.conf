# SSH hardening settings — Homelab From Scratch #2 (It's Lucho)
# Edit these lines in /etc/ssh/sshd_config (or put them in a file in /etc/ssh/sshd_config.d/).
# Read 04-sshd-config.md first: open the new port in the firewall BEFORE restarting SSH.
# Check: sudo sshd -t   ·   Apply: sudo systemctl restart ssh

# New SSH port (example: pick your own between 1024 and 32767)
Port 24816

# No direct root login: log in as your user and use sudo
PermitRootLogin no

# Keys only: no passwords, never empty ones
PasswordAuthentication no
PermitEmptyPasswords no

# Only these users can log in over SSH (replace with your user)
AllowUsers itslucho

# Close hung sessions after about 5 minutes (100 s x 3)
ClientAliveInterval 100
ClientAliveCountMax 3

# No graphical (X11) forwarding on a server
X11Forwarding no
